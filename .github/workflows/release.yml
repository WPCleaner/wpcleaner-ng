name: Make Release

on:
  push:
    branches:
      - main

jobs:
  build-ubuntu:
    if: startsWith(github.event.head_commit.message, 'Preparing release v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: >
        sudo apt-get update &&
        sudo apt-get install -y gettext

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper (using xvfb to provide a virtual display)
      uses: coactions/setup-xvfb@v1
      with:
        run: ./gradlew build

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-linux
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  build-windows:
    if: startsWith(github.event.head_commit.message, 'Preparing release v')
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: echo "C:\Program Files\Git\usr\bin" >> $GITHUB_PATH
      shell: bash

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-windows
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  build-macos:
    if: startsWith(github.event.head_commit.message, 'Preparing release v')
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: |
        brew install gettext
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-macos
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  create-release:
    needs: [build-ubuntu, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Extract version
      id: extract_version
      run: |
        version=$(grep 'version.prefix=' gradle.properties | cut -d'=' -f2)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Prepare assets for release
      run: |
        mkdir -p upload-assets
        cp release-assets/wpcleaner-linux/*.jar upload-assets/wpcleaner-ng-linux.jar
        cp release-assets/wpcleaner-windows/*.jar upload-assets/wpcleaner-ng-windows.jar
        cp release-assets/wpcleaner-macos/*.jar upload-assets/wpcleaner-ng-macos.jar

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Release v${{ steps.extract_version.outputs.version }}
        body_path: releases/v${{ steps.extract_version.outputs.version }}.md
        draft: false
        prerelease: false
        files: |
          upload-assets/wpcleaner-ng-linux.jar
          upload-assets/wpcleaner-ng-windows.jar
          upload-assets/wpcleaner-ng-macos.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
