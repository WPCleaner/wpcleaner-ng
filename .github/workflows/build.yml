# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ubuntu:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: >
        sudo apt-get update &&
        sudo apt-get install -y gettext

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper (using xvfb to provide a virtual display)
      uses: coactions/setup-xvfb@v1
      with:
        run: ./gradlew build

    - name: Upload Linux artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-linux
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  build-windows:

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: echo "C:\Program Files\Git\usr\bin" >> $GITHUB_PATH
      shell: bash

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Windows artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-windows
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  build-macos:

    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: |
        brew install gettext
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload macOS artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
      uses: actions/upload-artifact@v4
      with:
        name: wpcleaner-macos
        path: wpcleaner-application/wpcleaner-application-gui/build/libs/wpcleaner-application-gui-*.jar

  create-release:
    needs: [build-ubuntu, build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Extract version
      id: extract_version
      run: |
        version=$(grep 'version.prefix=' gradle.properties | cut -d'=' -f2)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Prepare assets for release
      run: |
        mkdir -p upload-assets
        cp $(ls release-assets/wpcleaner-linux/*.jar | grep -E "wpcleaner-application-gui-[0-9.]+(-SNAPSHOT)?\.jar$") upload-assets/wpcleaner-ng-linux.jar
        cp $(ls release-assets/wpcleaner-windows/*.jar | grep -E "wpcleaner-application-gui-[0-9.]+(-SNAPSHOT)?\.jar$") upload-assets/wpcleaner-ng-windows.jar
        cp $(ls release-assets/wpcleaner-macos/*.jar | grep -E "wpcleaner-application-gui-[0-9.]+(-SNAPSHOT)?\.jar$") upload-assets/wpcleaner-ng-macos.jar

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Release v${{ steps.extract_version.outputs.version }}
        body_path: releases/v${{ steps.extract_version.outputs.version }}.md
        draft: false
        prerelease: false
        files: |
          upload-assets/wpcleaner-ng-linux.jar
          upload-assets/wpcleaner-ng-windows.jar
          upload-assets/wpcleaner-ng-macos.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update version prefix and open Pull Request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${{ steps.extract_version.outputs.version }}"
        IFS='.' read -r major minor patch <<< "$version"
        new_patch=$((patch + 1))
        new_version="$major.$minor.$new_patch"
        
        sed -i "s/version.prefix=.*/version.prefix=$new_version/g" gradle.properties
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git checkout -b update/v$new_version
        git add gradle.properties
        git commit -m "Update version prefix to v$new_version"
        
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" update/v$new_version
        
        gh pr create \
          --title "Update version prefix to v$new_version" \
          --body "This PR automatically updates the version prefix in gradle.properties to v$new_version after releasing v$version." \
          --head "update/v$new_version" \
          --base "main" || echo "Warning: Could not create Pull Request"
