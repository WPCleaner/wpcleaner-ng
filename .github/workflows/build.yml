# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ubuntu:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: >
        sudo apt-get update &&
        sudo apt-get install -y gettext

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper (using xvfb to provide a virtual display)
      uses: coactions/setup-xvfb@v1
      with:
        run: ./gradlew build

  build-windows:

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: echo "C:\Program Files\Git\usr\bin" >> $GITHUB_PATH
      shell: bash

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  build-macos:

    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation/testing toolchain)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Set up build environment
      run: |
        brew install gettext
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-latest
            platform: macos-aarch64
          - runner: macos-15-intel
            platform: macos-x64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK 25 (for compilation toolchain and jpackage)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Set up JDK 21 (for executing Gradle daemon)
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build application and launcher for ${{ matrix.platform }}
      run: ./gradlew :wpcleaner-application-gui:bootJar :wpcleaner-launcher:packageLauncher

    - name: Prepare assets for release
      shell: bash
      run: |
        mkdir -p release-assets
        cp $(ls wpcleaner-application/wpcleaner-application-gui/build/libs/*.jar | grep -E "wpcleaner-application-gui-[0-9.]+(-SNAPSHOT)?\.jar$") release-assets/wpcleaner-ng-${{ matrix.platform }}.jar
        cp wpcleaner-launcher/build/distributions/wpcleaner-ng-launcher-${{ matrix.platform }}.* release-assets/

    - name: Upload ${{ matrix.platform }} artifact
      uses: actions/upload-artifact@v7
      with:
        name: wpcleaner-${{ matrix.platform }}
        path: release-assets/*

  create-release:
    needs: [build-ubuntu, build-windows, build-macos, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Preparing release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Extract version
      id: extract_version
      run: |
        version=$(grep 'version.prefix=' gradle.properties | cut -d'=' -f2)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: upload-assets
        merge-multiple: true

    - name: Generate the manifest read by the launcher
      run: >
        python3 scripts/release_manifest.py
        --version ${{ steps.extract_version.outputs.version }}
        --assets upload-assets
        --output upload-assets/wpcleaner-ng.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Release v${{ steps.extract_version.outputs.version }}
        body_path: releases/v${{ steps.extract_version.outputs.version }}.md
        draft: false
        prerelease: false
        files: upload-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update version prefix and open Pull Request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${{ steps.extract_version.outputs.version }}"
        IFS='.' read -r major minor patch <<< "$version"
        new_patch=$((patch + 1))
        new_version="$major.$minor.$new_patch"
        
        sed -i "s/version.prefix=.*/version.prefix=$new_version/g" gradle.properties
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git checkout -b update/v$new_version
        git add gradle.properties
        git commit -m "Update version prefix to v$new_version"
        
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" update/v$new_version
        
        gh pr create \
          --title "Update version prefix to v$new_version" \
          --body "This PR automatically updates the version prefix in gradle.properties to v$new_version after releasing v$version." \
          --head "update/v$new_version" \
          --base "main" || {
            echo "::warning:: Could not create Pull Request. Please enable 'Allow GitHub Actions to create and approve pull requests' in your repository settings under Settings -> Actions -> General -> Workflow permissions."
          }
